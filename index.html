<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#060607" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MINIMAL UNIVERSE</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">MINIMAL&nbsp;UNIVERSE</div>
      <div class="meta">
        <span class="drag" id="bpm" title="arrastra o rueda">124</span><span class="u">BPM</span>
        <span class="sep"></span>
        <span class="drag" id="key" title="tónica global · arrastra o rueda">A</span><button id="mode" title="modo (escala) global · clic = el siguiente">EÓLICO</button>
        <span class="sep hide-compact"></span>
        <span id="pos" class="hide-compact">001.1</span>
        <span class="sep"></span>
        <button id="state" title="ESPACIO">GENERAR</button>
        <span class="sep"></span>
        <button id="rec" title="grabar lo que suena en WAV de 24 bits · empieza en el primer sonido · otra vez = parar y guardar · R">● GRABAR</button>
        <span class="sep"></span>
        <button id="mixbtn" title="volumen por instrumento · M">MIXER</button>
        <span class="sep"></span>
        <button id="optbtn" title="preferencias">OPCIONES</button>
        <span class="sep" id="health-sep"></span>
        <button id="health" title="CORTES: el audio se quedó sin datos · TARDE: notas programadas fuera de tiempo · clic = poner a cero">AUDIO OK</button>
      </div>
    </header>

    <!-- solo en pantallas pequeñas y modo DJ -->
    <nav class="tabs" id="tabs">
      <button data-tab="A" class="on">UNIVERSO A</button>
      <button data-tab="M">MEZCLA</button>
      <button data-tab="B">UNIVERSO B</button>
    </nav>

    <main id="stage" data-tab="A">
      <div class="deck left" id="deckA"></div>

      <section class="mixer" id="mixer">
        <div class="col-title">MEZCLA</div>
        <button class="mx-easy-btn" title="EASY EQ: una perilla por banda que pasa de A (izquierda) a B (derecha); en el centro, los dos. El bajo se intercambia: nunca dos enteros">EASY EQ</button>
        <div class="mx-grid">
          <span class="mx-deck">A</span><span></span><span class="mx-deck">B</span>
          <div class="eqk" data-d="0" data-k="hi"></div><span class="mx-lab eqk">HI</span><div class="eqk" data-d="1" data-k="hi"></div>
          <div class="eqk" data-d="0" data-k="mid"></div><span class="mx-lab eqk">MID</span><div class="eqk" data-d="1" data-k="mid"></div>
          <div class="eqk" data-d="0" data-k="lo"></div><span class="mx-lab eqk">LOW</span><div class="eqk" data-d="1" data-k="lo"></div>
          <span class="easy"></span><div class="mx-xc easy"><div data-x="hi"></div><span class="mx-lab">HI</span></div><span class="easy"></span>
          <span class="easy"></span><div class="mx-xc easy"><div data-x="mid"></div><span class="mx-lab">MID</span></div><span class="easy"></span>
          <span class="easy"></span><div class="mx-xc easy"><div data-x="lo"></div><span class="mx-lab" title="Graves: suena como mucho un kick y un bajo. Abajo, de qué universo sale cada uno">LOW<small class="mx-roles"><span>KICK <b class="r-kick">A</b></span><span>BAJO <b class="r-bass">A</b></span></small></span></div><span class="easy"></span>
          <div data-d="0" data-k="filter"></div><span class="mx-lab">FILTRO<small>LP · HP</small></span><div data-d="1" data-k="filter"></div>
        </div>
        <div class="mx-faders">
          <div class="meter" data-d="0"><i></i></div>
          <div class="fader" data-d="0"><div class="t-track"><div class="t-line"></div><div class="t-handle"></div></div></div>
          <div class="fader" data-d="1"><div class="t-track"><div class="t-line"></div><div class="t-handle"></div></div></div>
          <div class="meter" data-d="1"><i></i></div>
        </div>
        <canvas id="scope"></canvas>
      </section>

      <div class="deck right" id="deckB"></div>
    </main>

    <!-- MIXER global: volumen por instrumento (se abre encima, la música sigue) -->
    <section class="instmix" id="instmix" hidden></section>
    <!-- OPCIONES: preferencias por apartados -->
    <section class="instmix options" id="options" hidden></section>
  </div>

  <div id="enter">
    <div class="enter-title">MINIMAL&nbsp;UNIVERSE</div>
    <div class="enter-modes" id="modes">
      <button class="mode-opt" data-mode="solo">
        <span class="mo-name">UN UNIVERSO</span>
        <span class="mo-desc">un mundo, todo el detalle</span>
      </button>
      <button class="mode-opt" data-mode="dj">
        <span class="mo-name">DJ</span>
        <span class="mo-desc">dos universos y mesa de mezcla</span>
      </button>
    </div>
    <div class="enter-keys">
      ESPACIO generar / pausa &nbsp;·&nbsp; R grabar &nbsp;·&nbsp; M mixer<br />
      <span class="k-solo">L loop &nbsp;·&nbsp; N nuevo universo</span><br />
      <span class="k-dj">DJ: Q loop A &nbsp;·&nbsp; W nuevo A &nbsp;|&nbsp; O nuevo B &nbsp;·&nbsp; P loop B</span>
    </div>
  </div>

  <script>
    // Abierto con doble clic (file://): el navegador bloquea los módulos. Avisamos.
    if (location.protocol === 'file:') {
      const e = document.getElementById('enter');
      e.style.cursor = 'default';
      e.innerHTML =
        '<div class="enter-title">MINIMAL&nbsp;UNIVERSE</div>' +
        '<div class="enter-sub">ábrelo con INICIAR.bat</div>' +
        '<div class="enter-keys">el navegador no deja sonar el motor abriendo index.html directamente</div>';
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
